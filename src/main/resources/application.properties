# Configuration for postgresql database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=maria17
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/restaurant_db
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.log.sql=true


# Configuration for flyway
quarkus.flyway.enabled=false
#quarkus.flyway.migrate-at-start=true
#quarkus.flyway.clean-at-start=true
#quarkus.flyway.baseline-on-migrate=true
#quarkus.flyway.validate-at-start=true

quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.resteasy.metrics.enabled=true

# Configuration OpenTelemetry for send metrics to Collector
quarkus.micrometer.export.otlp.enabled=true
quarkus.micrometer.export.otlp.url=http://localhost:55681/v1/metrics
quarkus.micrometer.export.otlp.step=30s
quarkus.micrometer.export.otlp.batch-size=100

quarkus.hibernate-orm.validate-in-dev-mode=true

# Configuration for kafka
kafka.bootstrap.servers=localhost:9092
kafka.producer.retries=3

%dev.quarkus.kafka.devservices.enabled=true

quarkus.http.host=0.0.0.0
