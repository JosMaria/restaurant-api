global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'quarkus-app'
    scrape_interval: 5s
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['172.17.0.1:8080']
        labels:
          application: 'restaurant-api'
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
